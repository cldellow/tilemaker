name: Publish relslow-patched image

# Builds ghcr.io/<owner>/tilemaker:relslow-patched (and :sha-<commit>) from the
# relslow-patched branch, which hikeratlas/basemap's workflows run. The fork's
# CI only publishes images from master.
#
# relslow-patched is dktue's debug/relslow (master plus open performance PRs)
# with hikeratlas patches on top: the GeoJSON Lua function, zstd, and fixes
# not yet upstream.

on:
  push:
    branches: [relslow-patched]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-relslow-patched
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tilemaker
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tilemaker:test
          build-args: |
            TILEMAKER_VERSION=relslow-patched
            TILEMAKER_BUILD_VERSION=relslow-patched-${{ github.sha }}
          cache-from: type=gha,scope=relslow-patched
          cache-to: type=gha,mode=max,scope=relslow-patched

      # Don't publish an image that can't build tiles: check gzip .mbtiles
      # (what the basemap layers use) and zstd .pmtiles.
      - name: Smoke test
        run: |
          mkdir -p out
          sed 's/"compress": "gzip"/"compress": "zstd"/' config.json > out/config-zstd.json
          run() {
            docker run --rm -v "$PWD:/data" -w /data tilemaker:test \
              --input test/monaco.pbf --process process.lua --quiet "$@"
          }
          run --config config.json --output out/gzip.mbtiles
          run --config out/config-zstd.json --output out/zstd.pmtiles
          ls -l out
          test -s out/gzip.mbtiles
          # PMTiles header byte 98 is the tile compression: 4 = zstd
          test "$(od -An -tu1 -j98 -N1 out/zstd.pmtiles | tr -d ' ')" = 4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          short=$(git rev-parse --short=12 HEAD)
          for tag in relslow-patched "sha-$short"; do
            docker tag tilemaker:test "$IMAGE:$tag"
            docker push -q "$IMAGE:$tag"
          done
          echo "Published $IMAGE:relslow-patched and $IMAGE:sha-$short" | tee -a "$GITHUB_STEP_SUMMARY"
