name: Publish relslow-patched image

# Builds ghcr.io/<owner>/tilemaker:relslow-patched (and :sha-<commit>) from the
# relslow-patched branch, which hikeratlas/basemap's workflows run. The fork's
# CI only publishes images from master.
#
# relslow-patched is dktue's debug/relslow (master plus open performance PRs)
# with hikeratlas patches on top: the GeoJSON Lua function, zstd, and fixes
# not yet upstream.
#
# The image is multi-arch (linux/amd64 and linux/arm64). Each architecture is
# built and smoke-tested natively on its own runner, rather than under QEMU,
# then the two are combined into one manifest list.

on:
  push:
    branches: [relslow-patched]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-relslow-patched
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tilemaker
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tilemaker:test
          build-args: |
            TILEMAKER_VERSION=relslow-patched
            TILEMAKER_BUILD_VERSION=relslow-patched-${{ github.sha }}
          cache-from: type=gha,scope=relslow-patched-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=relslow-patched-${{ matrix.arch }}

      # Don't publish an image that can't build tiles: check gzip .mbtiles
      # and zstd .pmtiles (what the basemap layers use).
      - name: Smoke test
        run: |
          docker run --rm --entrypoint uname tilemaker:test -m
          mkdir -p out
          sed 's/"compress": "gzip"/"compress": "zstd"/' config.json > out/config-zstd.json
          run() {
            docker run --rm -v "$PWD:/data" -w /data tilemaker:test \
              --input test/monaco.pbf --process process.lua --quiet "$@"
          }
          time run --config config.json --output out/gzip.mbtiles
          time run --config out/config-zstd.json --output out/zstd.pmtiles
          ls -l out
          test -s out/gzip.mbtiles
          # PMTiles header byte 98 is the tile compression: 4 = zstd
          test "$(od -An -tu1 -j98 -N1 out/zstd.pmtiles | tr -d ' ')" = 4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-architecture tags, which the publish job combines.
      - name: Push image
        run: |
          tag="$IMAGE:sha-$(git rev-parse --short=12 HEAD)-${{ matrix.arch }}"
          docker tag tilemaker:test "$tag"
          docker push -q "$tag"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tilemaker
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image
        run: |
          short=$(git rev-parse --short=12 HEAD)
          docker buildx imagetools create \
            -t "$IMAGE:relslow-patched" -t "$IMAGE:sha-$short" \
            "$IMAGE:sha-$short-amd64" "$IMAGE:sha-$short-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$short"
          echo "Published $IMAGE:relslow-patched and $IMAGE:sha-$short (linux/amd64, linux/arm64)" | tee -a "$GITHUB_STEP_SUMMARY"
